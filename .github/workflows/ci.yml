name: CI
on:
  push:
    branches: [ main, feat/package-1b, feat/auth, feat/auth-clean ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install ruff and black
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
      - name: Auto-fix lint (ruff) and format (black)
        working-directory: backend
        run: |
          # Attempt to auto-fix issues in the runner workspace
          ruff format --quiet . || true
          ruff check --fix . || true
          black . || true
      - name: Run ruff
        working-directory: backend
        run: |
          ruff check .
      - name: Check formatting (black)
        working-directory: backend
        run: |
          black --check . || (echo "Run 'black .' to format" && exit 1)

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest httpx
      - name: Run unit tests
        working-directory: backend
        run: |
          pytest -q

  integration:
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fftf_admin
          POSTGRES_PASSWORD: fftf_password
          POSTGRES_DB: fresh_from_the_farm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fftf_admin"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Postgres (with timeout)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          echo "Waiting up to 60s for Postgres to be ready..."
          ATTEMPTS=0
          until pg_isready -h localhost -p 5432 -U fftf_admin || [ $ATTEMPTS -ge 60 ]; do
            ATTEMPTS=$((ATTEMPTS+1))
            echo "Waiting for Postgres... ($ATTEMPTS)"
            sleep 1
          done
          if ! pg_isready -h localhost -p 5432 -U fftf_admin; then
            echo "Postgres did not become ready in time" && exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies (integration)
        working-directory: backend
        env:
          DATABASE_URL: "******localhost:5432/fresh_from_the_farm"
        run: |
          python -m pip install --upgrade pip
          # Install package and integration dependencies
          pip install .
          pip install pytest httpx asyncpg sqlalchemy[asyncio] sqlmodel alembic
      - name: Create tables for integration tests (with retries)
        working-directory: backend
        env:
          DATABASE_URL: "******localhost:5432/fresh_from_the_farm"
        run: |
          set -e
          ATTEMPT=0
          until [ $ATTEMPT -ge 5 ]; do
            python ci/create_tables.py && break || true
            ATTEMPT=$((ATTEMPT+1))
            echo "create_tables attempt $ATTEMPT failed, retrying..."
            sleep 2
          done
          # Final attempt to ensure failure is visible
          python ci/create_tables.py
      - name: Run integration tests
        working-directory: backend
        env:
          ENVIRONMENT: integration
          DATABASE_URL: "******localhost:5432/fresh_from_the_farm"
        run: |
          pytest -q
