[project]
name = "fresh-from-the-farm-api"
version = "0.1.0"

description = "Backend API for Fresh From The Farm"

requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "redis",
    "pydantic-settings",
    "python-jose[cryptography]",
    "argon2-cffi",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
