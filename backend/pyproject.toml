[tool.poetry]
name = "fresh-from-the-farm-api"
version = "0.1.0"
description = "Backend API for Fresh From The Farm"
authors = ["shaileshkacharya <82354877+shaileshkacharya@users.noreply.github.com>"]

[tool.poetry.dependencies]
python = ">=3.13"
fastapi = "^0.101.0"
uvicorn = {extras = ["standard"], version = "^0.22.0"}
sqlmodel = "^0.0.8"
asyncpg = "^0.28.0"
psycopg = {version = "^3.3.0", optional = true}
redis = "^4.8.0"
alembic = "^1.11.0"
python-dotenv = "^1.0.0"
python-jose = {extras=["cryptography"], version = "^3.3.0"}
argon2-cffi = "^21.3.0"
python-json-logger = "^2.0.7"

[tool.poetry.dev-dependencies]
pytest = "^8.4.0"
httpx = "^0.24.0"
ruff = "^0.15.0"
black = "^24.4.0"
mypy = "^1.5.1"
pre-commit = "^3.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
