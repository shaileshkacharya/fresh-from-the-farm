name: CI
on:
  push:
    branches: [ main, feat/package-1b, feat/auth ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install ruff and black
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
      - name: Run ruff
        run: |
          ruff check .
      - name: Check formatting (black)
        run: |
          black --check . || (echo "Run 'black .' to format" && exit 1)

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest httpx
      - name: Run tests
        run: |
          pytest -q
