name: CI
on:
  push:
    branches: [ main, feat/package-1b, feat/auth ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install ruff and black
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
      - name: Run ruff
        run: |
          ruff check .
      - name: Check formatting (black)
        run: |
          black --check . || (echo "Run 'black .' to format" && exit 1)

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest httpx
      - name: Run unit tests
        run: |
          pytest -q

  integration:
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fftf_admin
          POSTGRES_PASSWORD: fftf_password
          POSTGRES_DB: fresh_from_the_farm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fftf_admin"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          until pg_isready -h localhost -p 5432 -U fftf_admin; do
            echo "Waiting for Postgres..."
            sleep 1
          done
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        env:
          DATABASE_URL: postgresql+asyncpg://fftf_admin:fftf_password@localhost:5432/fresh_from_the_farm
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest httpx asyncpg
      - name: Run integration tests
        env:
          ENVIRONMENT: integration
          DATABASE_URL: postgresql+asyncpg://fftf_admin:fftf_password@localhost:5432/fresh_from_the_farm
        run: |
          pytest -q
